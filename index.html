<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hệ Thống Đánh Giá Học Tập Sinh Viên ICTU</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <h1>Hệ Thống Đánh Giá Học Tập Sinh Viên ICTU</h1>
    <input type="text" id="name" placeholder="Họ tên sinh viên" />
    <input type="number" id="score" placeholder="Nhập điểm (0 - 10)" min="0" max="10" step="0.1" />
    <div class="error" id="error" style="display:none;"></div>
    <button id="submit">Xem kết quả</button>
    <div class="result empty" id="result"></div>
  </div>

<script>
  function classify(score) {
    if (score >= 9) return "Xuất sắc";
    if (score >= 8) return "Giỏi";
    if (score >= 6.5) return "Khá";
    if (score >= 5) return "Trung bình";
    if (score >= 3.5) return "Yếu";
    return "Kém";
  }

  document.getElementById('submit').addEventListener('click', function () {
    var name = document.getElementById('name').value.trim();
    var scoreRaw = document.getElementById('score').value.trim();
    var errorEl = document.getElementById('error');
    var resultEl = document.getElementById('result');

    if (!name || scoreRaw === '') {
      errorEl.textContent = 'Vui lòng nhập đầy đủ họ tên và điểm.';
      errorEl.style.display = 'block';
      return;
    }

    var score = parseFloat(scoreRaw);
    if (isNaN(score) || score < 0 || score > 10) {
      errorEl.textContent = 'Điểm phải là số trong khoảng 0 đến 10.';
      errorEl.style.display = 'block';
      return;
    }

    errorEl.style.display = 'none';
    var label = classify(score);
    resultEl.classList.remove('empty');
    resultEl.textContent = 'Sinh viên: ' + name + ' | Điểm: ' + score.toFixed(1) + ' | Xếp loại: ' + label;
  });
</script>
</body>
</html>
